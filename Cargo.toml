[package]
name = "gram-price-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
